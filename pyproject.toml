[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bovidaeta"
version = "0.1.4"
description = "A common data format for dairy cattle events, with loaders for SQLite and Delta Lake."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  # TODO(authors): fill in name/email of each author (or the lab itself).
  { name = "Bovi-Analytics Lab, Cornell University" },
]
maintainers = [
  # TODO(maintainers): the people who triage issues and cut releases.
  { name = "TODO" },
]
keywords = [
  "dairy",
  "cattle",
  "livestock",
  "precision livestock farming",
  "animal science",
  "agriculture",
  "data format",
  "data model",
  "milk recording",
  "herd management",
  "sqlite",
  "delta lake",
  "databricks",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0,<3",
  "polars>=1.11",
  "pyarrow>=16",
  "narwhals>=2.28",
]

[project.optional-dependencies]
# The Delta loader needs Spark. It is optional so that an edge device
# running only the SQLite path does not have to install pyspark; inside a
# Databricks notebook Spark is already present and this extra is not
# needed either.
delta = ["pyspark>=3.5"]

[project.urls]
# TODO(urls): check these once the repo is public; add Documentation when there are docs.
Homepage = "https://bovi-analytics.org/"
Repository = "https://github.com/Bovi-Analytics/bovidaeta"
Issues = "https://github.com/Bovi-Analytics/bovidaeta/issues"
Changelog = "https://github.com/Bovi-Analytics/bovidaeta/releases"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
bovidaeta = ["schemas/*.sql", "py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
