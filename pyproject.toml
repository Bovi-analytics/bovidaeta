[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bovidaeta"
version = "0.1.2"
description = "Farm and cattle domain definitions by Bovi Analytics."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "pydantic",
  "polars>=1.11",  # join_asof(check_sortedness=...)
  "pyarrow",
]

# The Delta loader needs Spark. It is optional so that an edge device
# running only the SQLite path does not have to install pyspark; inside a
# Databricks notebook Spark is already present and this extra is not
# needed either.
#[project.optional-dependencies]
#delta = ["pyspark>=3.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
bovidaeta = ["schemas/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
