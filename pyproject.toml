[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farm-data-definitions"
version = "0.1.0"
description = "Farm data models and event definitions by Bovi Analytics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
