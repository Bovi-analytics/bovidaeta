[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bovidaeta"
dynamic = ["version"]  # from git tags, via setuptools-scm
description = "A common data format for dairy cattle events, with loaders for SQLite and Delta Lake."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Same people, in the same order, as CITATION.cff (without the lab entry,
# whose comma would be ambiguous in the comma-separated Author field).
authors = [
  { name = "Enhong Liu" },
  { name = "Meike van Leerdam" },
  { name = "Sumit Sharma" },
  { name = "Haiyu Yang" },
  { name = "Hanlu Zhang" },
  { name = "Puchun Niu" },
  { name = "Haowen Hu" },
  { name = "Lipika Mallikarjuna" },
  { name = "Ed Hansen" },
  { name = "Bart de Zoete" },
  { name = "Miel Hostens" },
]
maintainers = [
  { name = "Bart de Zoete", email = "bd482@cornell.edu" },
]
keywords = [
  "dairy",
  "cattle",
  "livestock",
  "precision livestock farming",
  "animal science",
  "agriculture",
  "data format",
  "data model",
  "milk recording",
  "herd management",
  "sqlite",
  "delta lake",
  "databricks",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0,<3",
  "polars>=1.11",
  "pyarrow>=16",
  "narwhals>=2.28",
]

[project.optional-dependencies]
# The Delta loader needs Spark. It is optional so that an edge device
# running only the SQLite path does not have to install pyspark; inside a
# Databricks notebook Spark is already present and this extra is not
# needed either.
delta = ["pyspark>=3.5"]

[project.urls]
# TODO(urls): check these once the repo is public; add Documentation when there are docs.
Homepage = "https://bovi-analytics.org/"
Repository = "https://github.com/Bovi-Analytics/bovidaeta"
Issues = "https://github.com/Bovi-Analytics/bovidaeta/issues"
Changelog = "https://github.com/Bovi-Analytics/bovidaeta/releases"

[dependency-groups]
dev = ["pytest", "ruff==0.17.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
bovidaeta = ["schemas/*.sql", "schemas/migrations/*.sql", "py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Versions come from git tags (vX.Y.Z), created by the release workflow.
# Untagged commits get a dev version like 0.2.1.dev3; drop the "+g<hash>"
# suffix so those builds can be uploaded to TestPyPI.
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.ruff]
# Databricks notebook globals used in pipelines/ and examples/.
builtins = ["dbutils", "display", "spark"]

[tool.semantic_release]
# Only used to work out the next version from Conventional Commit messages
# and to create the tag + GitHub Release. Nothing is committed back to main.
tag_format = "v{version}"
commit_parser = "conventional"
allow_zero_version = true
major_on_zero = false
build_command = ""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.remote]
type = "github"
