[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farm-data-definitions"
version = "0.1.0"
description = "Canonical farm data models and event definitions for Bovi Analytics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
